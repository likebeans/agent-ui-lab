name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Install dependencies
        run: npm ci
      - name: Build static learning site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build:pages
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify static site without an API server
        env:
          PLAYWRIGHT_CHANNEL: chromium
          PAGES_SKIP_BUILD: '1'
          PAGES_TEST_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run test:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm the validated commit is still main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$main_sha" != "$VALIDATED_SHA" ]; then
            printf '%s\n' 'main has advanced; run the workflow for the latest commit.' >&2
            exit 1
          fi
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
